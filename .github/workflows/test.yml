name: 🤖 Testes Automatizados

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'automation/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - 'automation/**'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 🔁 Garantir código do Automation
        run: |
          if [ ! -f automation/package.json ]; then
            echo "Automation não veio no checkout. Clonando repositório externo..."
            rm -rf automation
            git clone --depth 1 https://github.com/guia-aventureiro/guia-aventureiro-automation.git automation
          else
            echo "Automation já disponível no checkout."
          fi

      - name: 📦 Instalar dependências (Backend)
        working-directory: ./backend
        run: npm ci

      - name: 📦 Instalar dependências (Automation)
        working-directory: ./automation
        run: npm ci

      - name: ⏳ Aguardar MongoDB
        run: |
          npx wait-on tcp:127.0.0.1:27017 -t 30000

      - name: 🚀 Iniciar Backend em Background
        working-directory: ./backend
        env:
          NODE_ENV: test
          TEST_MODE: 'true'
          MONGO_URI: mongodb://127.0.0.1:27017/guia-aventureiro-test
          MONGODB_URI: mongodb://127.0.0.1:27017/guia-aventureiro-test
          JWT_SECRET: test-secret-key
          STRIPE_SECRET_KEY: sk_test_dummy
          GOOGLE_MAPS_API_KEY: test-key
          CLOUDINARY_NAME: test
          CLOUDINARY_API_KEY: test
          CLOUDINARY_API_SECRET: test
        run: |
          try_start_backend() {
            local mongo_uri="$1"
            echo "Tentando iniciar backend com MONGO_URI=$mongo_uri"

            export MONGO_URI="$mongo_uri"
            export MONGODB_URI="$mongo_uri"

            npm start > /tmp/backend.log 2>&1 &
            BACKEND_PID=$!

            for i in {1..30}; do
              if ! kill -0 "$BACKEND_PID" 2>/dev/null; then
                echo "Processo backend encerrou prematuramente"
                cat /tmp/backend.log
                return 1
              fi

              if curl -fsS http://localhost:3000/health | grep -q '"status":"OK"'; then
                echo "✅ Backend saudável e pronto para os testes"
                return 0
              fi

              echo "Aguardando backend ficar saudável... tentativa $i/30"
              sleep 2
            done

            kill "$BACKEND_PID" 2>/dev/null || true
            echo "Backend não ficou saudável dentro do tempo com URI: $mongo_uri"
            cat /tmp/backend.log
            return 1
          }

          try_start_backend "mongodb://127.0.0.1:27017/guia-aventureiro-test" \
            || try_start_backend "mongodb://mongodb:27017/guia-aventureiro-test"

      - name: 🧪 Executar Testes com Retry
        working-directory: ./automation
        env:
          NODE_ENV: test
          API_URL: http://localhost:3000
          RETRY: 'true'
        run: npm run test:ci

      - name: 📊 Gerar Coverage Report
        working-directory: ./automation
        if: always()
        env:
          NODE_ENV: test
          API_URL: http://localhost:3000
          COVERAGE: 'true'
        run: npm run test:coverage || true

      - name: 📤 Upload Coverage para Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./automation/coverage/lcov.info
          flags: integration-tests
          name: coverage-report

      - name: 📋 Publicar Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: ./automation/coverage/reports/junit.xml
          check_name: Test Results

      - name: 📊 Comentar Coverage no PR
        uses: romeovs/lcov-reporter-action@v0.3.1
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          lcov-file: ./automation/coverage/lcov.info

      - name: 🔍 Verificar Backend Logs
        if: failure()
        run: tail -50 /tmp/backend.log

      - name: 💾 Salvar Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            automation/coverage/
            /tmp/backend.log
          retention-days: 7

      - name: ❌ Falhar se Coverage < Threshold
        working-directory: ./automation
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            LINES=$(grep -o '"lines":{[^}]*}' coverage/coverage-summary.json | grep -o '[0-9.]*' | head -1)
            echo "Coverage de linhas: $LINES%"
            if (( $(echo "$LINES < 65" | bc -l) )); then
              echo "❌ Coverage abaixo do threshold (65%)"
              exit 1
            fi
          fi

  test-summary:
    runs-on: ubuntu-latest
    if: always()
    needs: test

    steps:
      - name: 📊 Event File
        uses: actions/download-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: test-results

      - name: ✅ Testes Completos!
        run: |
          echo "✅ Suite de testes executada com sucesso"
          echo "📊 Verifique os results de reports acima para detalhes"
