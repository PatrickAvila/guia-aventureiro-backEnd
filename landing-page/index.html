<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia do Aventureiro - Roteiro Compartilhado</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #005A8D 0%, #003d5e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            background: white;
            border-radius: 24px;
            padding: 48px 32px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .logo {
            font-size: 64px;
            margin-bottom: 24px;
        }

        h1 {
            color: #005A8D;
            font-size: 28px;
            margin-bottom: 16px;
            font-weight: 700;
        }

        p {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .btn {
            display: inline-block;
            background: #005A8D;
            color: white;
            text-decoration: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            transition: all 0.3s;
            margin: 8px;
        }

        .btn:hover {
            background: #003d5e;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 90, 141, 0.3);
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #005A8D;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .loading {
            color: #999;
            margin-top: 24px;
            font-size: 14px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #005A8D;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 24px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .stores {
            margin-top: 32px;
            padding-top: 32px;
            border-top: 1px solid #e0e0e0;
        }

        .store-badge {
            display: inline-block;
            margin: 8px;
            height: 48px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🗺️</div>
        <h1>Roteiro Compartilhado</h1>
        <p>Alguém compartilhou um roteiro de viagem incrível com você!</p>
        
        <div id="loading" style="display: none;">
            <div class="spinner"></div>
            <p class="loading">Abrindo o app...</p>
        </div>

        <div id="buttons">
            <a href="#" id="openAppBtn" class="btn">📱 Abrir no App</a>
            <br>
            <a href="https://play.google.com/store" class="btn btn-secondary" id="androidBtn" style="display: none;">
                📥 Baixar para Android
            </a>
            <a href="https://apps.apple.com" class="btn btn-secondary" id="iosBtn" style="display: none;">
                📥 Baixar para iOS
            </a>
        </div>

        <div class="stores" id="storeLinks">
            <p style="color: #999; font-size: 14px; margin-bottom: 16px;">Ainda não tem o app?</p>
            <!-- Substitua pelos seus links reais das lojas -->
            <a href="https://play.google.com/store" target="_blank">
                <img class="store-badge" src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Google Play">
            </a>
            <a href="https://apps.apple.com" target="_blank">
                <img class="store-badge" src="https://upload.wikimedia.org/wikipedia/commons/3/3c/Download_on_the_App_Store_Badge.svg" alt="App Store">
            </a>
        </div>
    </div>

    <script>
        // Extrai o shareId da URL
        const path = window.location.pathname;
        const match = path.match(/\/r\/([a-f0-9-]+)/i);
        const shareId = match ? match[1] : null;

        const openAppBtn = document.getElementById('openAppBtn');
        const loading = document.getElementById('loading');
        const buttons = document.getElementById('buttons');
        const androidBtn = document.getElementById('androidBtn');
        const iosBtn = document.getElementById('iosBtn');

        // Detecta o sistema operacional
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        const isAndroid = /Android/.test(navigator.userAgent);
        const isMobile = isIOS || isAndroid;

        if (shareId) {
            // Esconde loading
            loading.style.display = 'none';
            buttons.style.display = 'block';

            // Configura botão "Abrir no App"
            const appUrl = `guiaaventureiro://shared/${shareId}`;
            openAppBtn.href = appUrl;
            openAppBtn.textContent = '📱 Abrir no App';
            
            openAppBtn.addEventListener('click', (e) => {
                e.preventDefault();
                
                // Tenta abrir o app
                window.location.href = appUrl;
                
                // Em 1.5s, se não abriu, mostra opções de download
                setTimeout(() => {
                    if (isAndroid) {
                        androidBtn.style.display = 'inline-block';
                    } else if (isIOS) {
                        iosBtn.style.display = 'inline-block';
                    }
                }, 1500);
            });
        } else {
            // Sem shareId válido
            loading.style.display = 'none';
            document.querySelector('h1').textContent = 'Link Inválido';
            document.querySelector('p').textContent = 'Este link de compartilhamento não é válido.';
            buttons.style.display = 'none';
        }
    </script>
</body>
</html>
